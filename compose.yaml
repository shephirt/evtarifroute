# Production deployment (the default compose file) — fully standalone, no
# build step. Pulls the pre-built image published by the GitHub Actions
# workflow (see .github/workflows/docker-image.yml) from GHCR.
#
# Usage on a production host:
#   1. Copy this file and .env.example (-> .env) to the host (you do NOT
#      need the rest of the source tree — no build context here).
#   2. Fill in .env: DB credentials, OCM_API_KEY, ORS_API_KEY, and
#      optionally IMAGE_TAG (defaults to "latest").
#   3. docker compose up -d
#
# The app is published on :8000. Put your own reverse proxy / TLS
# termination in front of it (Caddy, nginx, Traefik, whatever you already
# run) — that's intentionally not included here.
#
# For local development (build from source instead of pulling the image),
# use compose.dev.yaml instead:
#   docker compose -f compose.dev.yaml up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/shephirt/evtarifroute:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OCM_API_KEY: ${OCM_API_KEY}
      ORS_API_KEY: ${ORS_API_KEY}
      TARGET_REGIONS: ${TARGET_REGIONS}
      ETL_INTERVAL_HOURS: ${ETL_INTERVAL_HOURS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Frontend (Vue 3 + Leaflet + Vite)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(frontend)"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Backend (FastAPI, SQLAlchemy, GeoAlchemy2, Alembic, etc.)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(backend)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  # Docker base images (Dockerfile: node/python; compose.yaml/compose.dev.yaml:
  # postgis/postgis)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions workflow dependencies (actions/checkout, docker/build-push-action, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

name: Build and Publish Docker Image

# Builds the combined app image (multi-stage: Vue frontend + FastAPI
# backend, see Dockerfile) and publishes it to GitHub Container Registry
# (ghcr.io). Consumed by compose.yaml for deployment.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Skip login on pull_request builds from forks (no push permission
        # anyway) — still build the image to validate it compiles.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Explicit `latest` rule instead of relying on metadata-action's
          # `latest=auto` flavor — that default turned out to only apply
          # `latest` on semver *tag* pushes (v0.1.0), NOT on plain pushes to
          # main (verified: `latest` stayed pinned to the v0.1.0 image for
          # several subsequent main-branch pushes/fixes, silently serving
          # stale/broken images). Since this workflow only ever runs on a
          # `push` event for main-branch commits or version tags (see the
          # `on:` triggers above — pull_request builds don't push at all),
          # any `push` event reaching this step should update `latest`.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
